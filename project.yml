name: Assistant
options:
  bundleIdPrefix: com.techadnank9
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: S2UTA2J3GD
    CODE_SIGN_STYLE: Automatic
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.4
  twilio-voice-ios:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.13.7
targets:
  Assistant:
    type: application
    platform: iOS
    sources: [Assistant]
    entitlements:
      path: Assistant/Resources/Assistant.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        aps-environment: development
    info:
      path: Assistant/Resources/Info.plist
      properties:
        CFBundleDisplayName: Assistant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: The assistant listens so you can test it by talking to it.
        NSSpeechRecognitionUsageDescription: Speech is transcribed on this iPhone so the assistant can understand callers.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.assistantagent.call
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: twilio-voice-ios
        product: TwilioVoice
